# Runs what `make check` runs, on every PR and every push to main (docs/sessions/S01-tooling.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every commit, not only the last one
      - name: No secrets in any commit (like `make secrets`)
        run: make secrets

  backend:
    name: Backend (lint, types, licenses, unit, integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check . ../eval
          uv run ruff format --check . ../eval
      - name: Types
        run: uv run mypy
      - name: Licenses (no GPL or AGPL)
        run: uv run python -m konboro.licenses
      - name: Unit tests
        run: uv run pytest -m "not integration"
      - name: OpenAPI spec is current (run `make gen-client` and commit)
        run: |
          uv run python -m konboro.api.openapi ../frontend/src/api/openapi.json
          git diff --exit-code -- ../frontend/src/api/openapi.json
      - name: Start local services
        working-directory: .
        run: docker compose up -d --wait
      - name: Integration tests
        run: uv run pytest -m integration
      - name: Service logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color

  eval:
    # The golden-set eval in replay mode (S06, dev-strategy §6): deterministic and free. It runs when a PR touches
    # what can move a score, and on every push to main. The markdown summary goes to the job summary; a metric
    # below eval/baseline.json fails the job.
    name: Golden eval (replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the pipeline?
        id: changes
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          paths='^(backend/konboro/pipeline|backend/konboro/contracts|backend/konboro_llm|eval|golden)/'
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No pipeline, contract, model gateway, eval or golden change: eval skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        if: steps.changes.outputs.run == 'true'
      - name: Start local services
        if: steps.changes.outputs.run == 'true'
        working-directory: .
        run: docker compose up -d --wait
      - name: Eval against the baseline
        if: steps.changes.outputs.run == 'true'
        run: PYTHONPATH=.. uv run python -m eval.run
      - name: Upload the report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/reports
          retention-days: 30

  frontend:
    name: Frontend (lint, types, licenses, unit, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # E2E runs against the real API and pipeline worker (backend/konboro/devtools/e2e.py), so this job needs Python
      # and the compose services too.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Generated client matches the OpenAPI spec (run `make gen-client` and commit)
        run: |
          pnpm run gen:client
          git diff --exit-code -- src/api/schema.ts
      - name: Types
        run: pnpm typecheck
      - name: Licenses (no GPL or AGPL)
        run: pnpm run license-check
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Start Postgres, S3 and SQS
        working-directory: .
        run: docker compose up -d --wait
      - name: E2E (desktop and mobile; Playwright starts the E2E API and the web app)
        run: pnpm e2e
      - name: Screenshots match the accepted baselines (Playwright's Linux image, like `make check-screenshots`)
        working-directory: .
        run: SCREENSHOTS_CHECK=1 frontend/e2e/visual/update.sh
      - name: Service logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
