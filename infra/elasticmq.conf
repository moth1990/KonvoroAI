# ElasticMQ = local SQS. One queue per pipeline stage (specs/12-tech-stack.md §3),
# each sending messages to the DLQ after 3 failed receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  konboro-dlq {}
  konboro-s1-intake { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s2-extraction { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s3-symbols { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s4-association { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s5-matching { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s6-validation { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
  konboro-s7-pricing { deadLettersQueue { name = "konboro-dlq", maxReceiveCount = 3 } }
}
