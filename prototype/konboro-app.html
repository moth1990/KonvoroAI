<title>קונבורו</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: app shell with a nav rail on the start (right) side; on phones a bottom tab bar.
   The review screen is a working surface: lines and drawing side by side, chat as a drawer. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EBEEF3; --line:#D9DEE6; --line-strong:#C3CAD5;
  --fg:#17202B; --muted:#5A6576; --faint:#8A94A3;
  --accent:#2747C6; --accent-ink:#FFFFFF; --accent-soft:#E7ECFB;
  --copper:#B5693A;
  --ok:#1D8456; --ok-soft:#E1F3EA; --warn:#A86F12; --warn-soft:#FBF0D9; --bad:#C2372C; --bad-soft:#FBE5E2;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --font-display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Hebrew","Rubik",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --surface-2:#1B2430; --line:#28323F; --line-strong:#364253;
  --fg:#E6EBF2; --muted:#9BA6B5; --faint:#6F7A8A;
  --accent:#8199FF; --accent-ink:#0B1020; --accent-soft:#1D294D; --copper:#D38C5B;
  --ok:#4DC48C; --ok-soft:#11301F; --warn:#E3AB4B; --warn-soft:#33270E; --bad:#F27A6E; --bad-soft:#3A1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --surface-2:#1B2430; --line:#28323F; --line-strong:#364253;
  --fg:#E6EBF2; --muted:#9BA6B5; --faint:#6F7A8A;
  --accent:#8199FF; --accent-ink:#0B1020; --accent-soft:#1D294D; --copper:#D38C5B;
  --ok:#4DC48C; --ok-soft:#11301F; --warn:#E3AB4B; --warn-soft:#33270E; --bad:#F27A6E; --bad-soft:#3A1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

html,body,#app{height:100%}
#app{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
.mono{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- buttons, chips, inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:18px;height:18px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:transparent;border-color:var(--line-strong)}
.des{font-family:var(--font-mono);font-size:11.5px;background:var(--surface-2);border-radius:4px;padding:0 5px;color:var(--fg);direction:ltr;unicode-bidi:isolate}
.field{display:grid;gap:5px}
.field label{font-weight:500;font-size:13px}
.input{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--bad)}
.err-msg{color:var(--bad);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.toggle{position:relative;width:36px;height:20px;border-radius:999px;background:var(--line-strong);border:0;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{inset-inline-start:18px}
.meter{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.meter.warn>i{background:var(--warn)}

/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);background:var(--surface)}
.login-brand{background:#121A26;color:#E8EDF5;padding:48px max(32px,env(safe-area-inset-left,0px)) 48px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-brand h1{font-size:30px;font-weight:600;max-width:15ch;line-height:1.25}
.login-brand p{color:#A7B2C4;max-width:44ch}
.busbars{display:grid;gap:14px;margin-block:8px}
.busbar{display:grid;grid-template-columns:38px 1fr;align-items:center;gap:12px;font-family:var(--font-mono);font-size:12px;color:#8996AA}
.busbar i{height:10px;border-radius:2px;display:block}
.busbar:nth-child(1) i{background:#8A5A3C}.busbar:nth-child(2) i{background:#2B2F36;outline:1px solid #3A414B}.busbar:nth-child(3) i{background:#7C8592}.busbar:nth-child(4) i{background:#3E6FD8}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-form form{width:100%;max-width:380px;display:grid;gap:16px}
.pw{position:relative}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 6px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--copper);display:grid;place-items:center}
.logo-mark svg{width:18px;height:18px}
.proto-tag{font-size:11.5px;border:1px dashed var(--line-strong);border-radius:999px;padding:1px 9px;color:var(--muted)}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-brand{padding:28px 20px}.login-brand h1{font-size:23px}.busbars{display:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:16px 12px}
.rail .logo{padding:4px 8px 16px}
.nav-a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500}
.nav-a:hover{background:var(--surface-2);color:var(--fg)}
.nav-a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-a .count{margin-inline-start:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:10px 8px 0;border-top:1px solid var(--line)}
.main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:auto}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px}
.content{padding-block:4px 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:grid;gap:20px;align-content:start}
.content>*{min-width:0}
.tabbar{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{display:none}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:grid;justify-items:center;gap:2px;padding:7px 2px;font-size:10.5px;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--accent)}
}

/* ---------- home ---------- */
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.grid-2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.stats,.stats.four{grid-template-columns:1fr}}
.stat{padding:14px 16px;display:grid;gap:6px}
.stat b{font-family:var(--font-display);font-size:24px;font-weight:600}
.list{display:grid}
.list-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.list-item:first-child{border-top:0}
.list-item:hover{background:var(--surface-2)}
.kind-ico{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.ttl{font-weight:600}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- upload ---------- */
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:28px 20px;display:grid;justify-items:center;gap:10px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.file-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.file-row:first-child{border-top:0}
.stages{display:grid;gap:2px}
.stage{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm)}
.stage .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.stage.done .dot{background:var(--ok-soft);color:var(--ok)}
.stage.run{background:var(--accent-soft)}
.stage.run .dot{background:var(--accent);color:var(--accent-ink)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.thumb{display:grid;gap:6px;grid-template-rows:auto auto auto 1fr;align-content:start;padding:8px;border:1px solid var(--line);border-radius:var(--r-md,10px);background:var(--surface)}
.thumb .tnote{font-size:11.5px;color:var(--muted);min-height:2.6em;line-height:1.3}
.thumb select{width:100%}
.modal.wide{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:2px;gap:2px;background:var(--surface-2);flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink,inherit);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.startbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.samples summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;padding:14px 16px}
.samples summary::-webkit-details-marker{display:none}
.stage .st{font-size:12px;white-space:nowrap;color:var(--muted)}
.stage.run .st{color:var(--accent);font-weight:600}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-inline-end:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sumgrid>div{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;display:grid;gap:2px}
.sup-tbl input{padding:5px 7px;font-size:13px}
.sup-tbl td{padding:6px 8px;vertical-align:middle}
.prod-cell{display:grid;gap:2px;min-width:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.thumb img{width:100%;aspect-ratio:1755/1240;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff}
.thumb select{font-size:12.5px;padding:4px 6px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface)}

/* ---------- review ---------- */
.review{display:flex;flex-direction:column;height:100%;min-height:0}
.rv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px;border-bottom:1px solid var(--line);background:var(--surface)}
.rv-head h1{font-size:18px}
.rv-totals{display:flex;gap:16px;align-items:baseline}
.rv-totals b{font-family:var(--font-display);font-size:18px;font-weight:600}
.rv-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);position:relative}
.rv-tabs{display:none}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.lines-pane{border-inline-end:1px solid var(--line);background:var(--surface)}
.lines-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block}
.sw.g{background:var(--ok)}.sw.y{background:var(--warn)}.sw.r{background:var(--bad)}
.lines-scroll{overflow:auto;flex:1;min-height:0}
.findings{margin:12px 14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.findings summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;background:var(--surface-2);font-weight:600}
.findings summary::-webkit-details-marker{display:none}
.finding{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.finding .acts{grid-column:2;display:flex;gap:6px;flex-wrap:wrap}
.sev{width:4px;border-radius:2px;align-self:stretch}
.sev.warning{background:var(--warn)}.sev.info{background:var(--accent)}.sev.error{background:var(--bad)}
.grp{padding:14px 14px 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;display:flex;gap:8px}
.ln{display:grid;grid-template-columns:4px minmax(0,1fr) 46px 96px 86px;gap:10px;align-items:center;padding:9px 14px 9px 14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.ln:hover{background:var(--surface-2)}
.ln[aria-selected="true"]{background:var(--accent-soft)}
.ln .stripe{align-self:stretch;border-radius:2px}
.ln.g .stripe{background:var(--ok)}.ln.y .stripe{background:var(--warn)}.ln.r .stripe{background:var(--bad)}
.ln.child{padding-inline-start:34px}
.ln.child .name{font-weight:400;color:var(--muted)}
.ln .name{font-weight:500}
.ln .sub{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center}
.ln .q,.ln .p,.ln .t{text-align:end;font-variant-numeric:tabular-nums}
.ln .t{font-weight:600}
.price-in{width:100%;text-align:end;border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r-sm);padding:4px 6px;font-variant-numeric:tabular-nums}
.price-in:focus{outline:none;box-shadow:0 0 0 3px var(--bad-soft)}
.lh{display:grid;grid-template-columns:4px minmax(0,1fr) 46px 96px 86px;gap:10px;padding:8px 14px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.lh span:nth-child(n+3){text-align:end}
.with-margin .ln,.with-margin .lh{grid-template-columns:4px minmax(0,1fr) 46px 96px 56px 86px}
.ln .mg,.lh .mg{text-align:end}
.warn-t{color:var(--warn)}
.detail{grid-column:1/-1;margin:4px 0 2px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:12px;cursor:default}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.dgrid{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;font-size:13px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.raw{font-family:var(--font-mono);direction:ltr;text-align:left;background:var(--surface-2);border-radius:var(--r-sm);padding:6px 8px;font-size:12.5px;white-space:pre-wrap}
.alt{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.alt:first-child{border-top:0}
.lines-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--surface)}
.drawing-pane{background:var(--surface-2)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.pg{flex:none;width:92px;border:2px solid transparent;border-radius:var(--r-sm);background:none;padding:0;display:grid;gap:3px;text-align:start}
.pg img{width:100%;aspect-ratio:1755/1240;object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff;display:block}
.pg span{font-size:11px;color:var(--muted);padding-inline:2px}
.pg[aria-current="true"]{border-color:var(--accent)}
.pg.skip img{opacity:.5}
.viewer{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none}
.viewer.drag{cursor:grabbing}
.canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.canvas img{display:block;width:1400px;max-width:none;height:auto;background:#fff;box-shadow:var(--shadow)}
.hl{position:absolute;border:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:4px;pointer-events:none}
.hl.find{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.vtools{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;box-shadow:var(--shadow)}
.pageinfo{position:absolute;top:10px;inset-inline-start:12px;inset-inline-end:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.pageinfo>*{pointer-events:auto}
.chat{position:absolute;inset-block:0;inset-inline-end:0;width:min(400px,100%);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:15}
.chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.55}
.msg.u{justify-self:start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:4px}
.msg.a{justify-self:end;background:var(--surface-2);border-end-end-radius:4px}
.prop{border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:10px 12px;display:grid;gap:8px;justify-self:stretch}
.diff{display:grid;gap:4px;font-size:12.5px}
.diff div{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.diff s{color:var(--muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.chat-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.old-convs{font-size:12.5px;padding:0 14px 8px;color:var(--muted)}
.locked{background:var(--warn-soft);color:var(--warn);padding:8px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:500}
@media (max-width:820px){
  .rv-head{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rv-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
  .rv-tabs button{border:0;background:none;padding:7px;border-radius:var(--r-sm);font-weight:500;color:var(--muted)}
  .rv-tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .rv-body{grid-template-columns:1fr}
  .rv-body[data-tab="lines"] .drawing-pane,.rv-body[data-tab="lines"] .chat{display:none}
  .rv-body[data-tab="drawing"] .lines-pane,.rv-body[data-tab="drawing"] .chat{display:none}
  .rv-body[data-tab="chat"] .lines-pane,.rv-body[data-tab="chat"] .drawing-pane{display:none}
  .rv-body[data-tab="chat"] .chat{position:static;width:100%;box-shadow:none;border:0}
  .ln,.lh{grid-template-columns:4px minmax(0,1fr) 34px 78px;padding-inline:12px}
  .ln .t,.lh .t{display:none}
  .with-margin .ln,.with-margin .lh{grid-template-columns:4px minmax(0,1fr) 34px 78px 44px}
  .chat-toggle{display:none}
}

/* ---------- tables & misc pages ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:start;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.diff-row td{background:var(--bad-soft)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:grid;gap:4px}
.kpi b{font-family:var(--font-display);font-size:22px;font-weight:600}
.kpi.bad b{color:var(--bad)}
.qcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.qcard:first-child{border-top:0}
.qcard .acts{display:flex;gap:6px}
@media (max-width:620px){.qcard{grid-template-columns:1fr}}
.set-sec{display:grid;gap:0}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.sec-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}

/* ---------- overlays ---------- */
.toast{width:max-content;position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:var(--r);display:flex;gap:12px;align-items:center;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600}
@media (max-width:820px){.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}.kbd-hint{display:none}}
.wrap-any{overflow-wrap:anywhere;min-width:0}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:70;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(460px,100%);padding:20px;display:grid;gap:14px;box-shadow:var(--shadow)}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* ---------- 2.0 features (behind flags) ---------- */
.v2{font-size:10.5px;font-weight:600;border-radius:4px;padding:0 5px;background:var(--copper);color:#fff;letter-spacing:.02em}
.hero{display:grid;justify-items:center;gap:18px;padding-block:6vh 12px;text-align:center}
.hero h1{font-size:28px;font-weight:600}
.prompt{width:min(720px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 10px;display:grid;gap:8px;text-align:start}
.prompt textarea{border:0;resize:none;background:none;min-height:56px;outline:none;font-size:15px;line-height:1.5}
.prompt-bar{display:flex;align-items:center;gap:6px}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--surface);padding:0}
.round.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
.hero-sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(720px,100%)}
.build{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:1000px){.build{grid-template-columns:1fr}}
.build .msgs{max-height:52vh;min-height:220px}
.ux{position:absolute;border:2px dashed var(--bad);border-radius:4px;pointer-events:none}
.ux span{position:absolute;bottom:100%;inset-inline-start:-2px;background:var(--bad);color:#fff;font-size:20px;line-height:1.3;padding:1px 8px;border-radius:4px 4px 0 0;white-space:nowrap}
.doc{background:#fff;color:#1a1a1a;border:1px solid var(--line);border-radius:var(--r-sm);padding:18px;font-size:12.5px;display:grid;gap:10px;max-height:52vh;overflow:auto}
.doc table{width:100%;border-collapse:collapse}
.doc th,.doc td{border-bottom:1px solid #e3e3e3;padding:5px 4px;text-align:start}
.doc td.n,.doc th.n{text-align:end;font-variant-numeric:tabular-nums}
.modal.wide{width:min(640px,100%)}
</style>

const lineById = id => S.lines.find(l => l.id === id);
function status(l){
  if (l.deleted) return null;
  if (l.included) return "g";
  if (l.price == null) return "r";
  if (l.inferred && !l.approved) return "y";
  return "g";
}
function totals(){
  let sub = 0, g = 0, y = 0, r = 0;
  for (const l of S.lines){
    const st = status(l); if (!st) continue;
    if (st === "g") g++; else if (st === "y") y++; else r++;
    if (l.price != null && !l.included) sub += l.price * l.qty;
  }
  return {sub, vat: Math.round(sub * .18), total: Math.round(sub * 1.18), g, y, r};
}
const catById = id => S.catalog.find(c => c.id === id);
function prefSup(c){ if (!c || !c.sups.length) return null; return c.sups.find(x => x.pref) || [...c.sups].sort((a,b) => a.cost - b.cost)[0]; }
function catSale(c){ if (!c) return null; if (c.mode === "markup"){ const s0 = prefSup(c); return s0 ? Math.round(s0.cost * (1 + S.prefs.markup/100)) : c.sale; } return c.sale; }
function lineCost(l){
  if (l.costOverride != null) return l.costOverride;
  const c = catById(l.cat); if (!c) return null;
  const sp = l.supplier ? c.sups.find(x => x.s === l.supplier) : prefSup(c);
  return sp ? sp.cost : null;
}
function lineSupplier(l){ const c = catById(l.cat); if (!c) return l.costSupplier || null; return l.supplier || (prefSup(c) || {}).s || null; }
function margin(price, cost){ return price && cost != null ? Math.round(100 * (price - cost) / price) : null; }
function profit(){
  let cost = 0, sale = 0, noCost = 0;
  for (const l of S.lines){ if (l.deleted || l.included || l.price == null) continue; const c = lineCost(l); if (c == null){ noCost++; continue; } cost += c * l.qty; sale += l.price * l.qty; }
  return {cost, sale, profit: sale - cost, pct: sale ? Math.round(100 * (sale - cost) / sale) : null, noCost};
}
function coverage(){
  const ls = S.lines.filter(l => !l.deleted && !l.included);
  return Math.round(100 * ls.filter(l => l.price != null).length / ls.length);
}

let toastTimer;
function toast(text, undoable){
  let t = $(".toast"); if (t) t.remove();
  t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = `<span>${esc(text)}</span>${undoable ? '<button data-act="undo">בטל</button>' : ""}`;
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4200);
}
function pushUndo(label, restore){ S.undo.push({label, restore}); }
function doUndo(){
  const u = S.undo.pop(); if (!u){ toast("אין מה לבטל"); return; }
  u.restore(); render(); toast("בוטל: " + u.label);
}
function snapshotLines(){ return JSON.stringify(S.lines); }
function restoreLines(snap){ S.lines = JSON.parse(snap); }
function modal(html, cls = ""){
  closeModal();
  const bg = document.createElement("div"); bg.className = "modal-bg"; bg.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener("click", e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
  const f = bg.querySelector("button.primary, input"); if (f) f.focus();
}
function closeModal(){ const m = $(".modal-bg"); if (m) m.remove(); }

function runPipeline(){

let msgId = 1;
function ask(q){
  if (!q.trim()) return;
  S.msgs.push({who:"u", text:q});
  const n = q.replace(/\s+/g," ");
  if (/מגענ/.test(n) && /צהוב|למה/.test(n)){
    S.msgs.push({who:"a", html:`הזרם של C1–C4 לא כתוב בשרטוט. בחרתי <b>16A לפחות</b> לפי המא"זים F22–F25 (3X16A) שמעל כל מגען. אם אצלכם בוחרים למנועים מידה גדולה יותר, אפשר להחליף בשורה, ואחרי כמה פעמים אציע לעדכן את הכלל למפעל.<br><button class="btn sm" style="margin-top:6px" data-act="goline" data-id="c1">פתח את C1–C4</button>`});
  } else if (/חסר|לשלוח/.test(n)){
    const reds = S.lines.filter(l => status(l) === "r");
    S.msgs.push({who:"a", html: reds.length ? `כדי לשלוח בלי אזהרות חסרים מחירים ל-${reds.length} שורות:<br>${reds.map(l => `• ${esc(l.name)}`).join("<br>")}<br><button class="btn sm" style="margin-top:6px" data-act="onlyred">הצג רק אותן</button>` : "אין שורות אדומות. אפשר לשלוח."});
  } else if (/schneider|שניידר/i.test(n)){
    const abb = S.lines.filter(l => !l.deleted && /ABB S20|ABB SN20/.test(l.name));
    const id = msgId++;
    S.msgs.push({who:"a", text:`מצאתי ${abb.length} שורות של מא"זי ABB. זו ההצעה. שום דבר לא משתנה עד שתאשר.`});
    S.msgs.push({id, prop:{state:"pending", title:`החלפת ${abb.length} שורות ל-Schneider Acti9`, kind:"brand",
      rows: abb.map(l => [l.name, l.name.replace(/ABB S20\dM|ABB SN201M/, m => m.includes("SN") ? "Schneider iC60N" : "Schneider iC60N")]),
      effect:`אין מחירים של Schneider במחירון, ולכן ${abb.length} השורות יהפכו לאדומות עד שתזין מחיר.`, ids: abb.map(l => l.id)}});
  } else if (/F26|שאריות/.test(n)){
    const id = msgId++;
    S.msgs.push({id, prop:{state:"pending", title:"סגירת הממצא F26–F29 כשאריות בחזית", kind:"finding", rows:[["F26–F29: ממצא פתוח","שאריות בחזית, לא נספרים"]]}});
  } else {
    S.msgs.push({who:"a", text:"בדמו הזה הצ'אט מכיר רק את הפקודות שמתחת לחלון. במוצר הוא עונה על כל שאלה על ההצעה, ומציע שינויים לאישור."});
  }
  render(); const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}
function applyProp(id){
  const m = S.msgs.find(x => x.id == id); if (!m) return;
  const p = m.prop;
  if (p.kind === "brand"){
    const snap = snapshotLines();
    for (const lid of p.ids){ const l = lineById(lid); l.name = l.name.replace(/ABB S20\dM|ABB SN201M/, "Schneider iC60N"); l.price = null; l.psrc = null; l.chips = []; l.hint = "אין מחיר של Schneider במחירון"; }
    pushUndo("החלפה ל-Schneider", () => { restoreLines(snap); p.state = "pending"; });
  } else {
    const f = S.findings.find(x => x.id === "fv"); f.done = true;
    pushUndo("סגירת ממצא F26–F29", () => { f.done = false; p.state = "pending"; });
  }
  p.state = "applied"; render(); toast(p.kind === "brand" ? "הוחל. השורות אדומות עד שיוזן מחיר" : "הממצא נסגר", true);
}

  if (!name){ $("#ed-p").classList.add("err"); toast("חסר שם מוצר"); return; }
  const sups = [...document.querySelectorAll("#ed-sups tr")].map((tr, i) => {
    const g = k => tr.querySelector(`[data-f="${k}"]`).value.trim();
    return {s:g("s"), ssku:g("ssku"), cost:parseFloat(g("cost")), lead:parseInt(g("lead")) || null, pref: tr.querySelector('input[type="radio"]').checked, date:"היום"};
  }).filter(x => x.s && x.cost > 0);
  const mode = $('input[name="ed-mode"]:checked').value;
  const sale = parseFloat($("#ed-sale").value);
  if (mode === "fixed" && !(sale > 0) && !$("#ed-cons").checked){ $("#ed-sale").classList.add("err"); toast("הזינו מחיר מכירה, או בחרו חוק רווח"); return; }
  if (mode === "markup" && !sups.length){ toast("חוק רווח צריך לפחות ספק אחד עם עלות"); return; }
  let c = id ? catById(id) : null;
  const before = c ? catSale(c) : null;
  if (!c){ c = {id:"m_" + Date.now(), src:"הוזן ידנית", hist:[]}; S.catalog.unshift(c); }
  Object.assign(c, {p:name, sku:$("#ed-sku").value.trim(), brand:$("#ed-brand").value.trim() || "—", fam:$("#ed-fam").value.trim(), unit:$("#ed-unit").value,
    mode, sale: sale > 0 ? sale : null, sups, consumable:$("#ed-cons").checked, includes: $("#ed-inc") ? $("#ed-inc").value : (c.includes||"")});
  const after = catSale(c);
  c.hist.unshift({d:"היום", t: !id ? "נוצר ידנית" : before !== after ? `מחיר מכירה ${ils(before)} ← ${ils(after)}` : "עודכנו פרטים או ספקים"});
  closeModal(); render();
  const used = S.lines.filter(l => !l.deleted && l.cat === c.id && l.price != null && l.price !== after && !l.override).length;
  toast(!id ? "המוצר נוסף למחירון" : before !== after
    ? `נשמר. הצעות שנשלחו לא השתנו${used ? `; בטיוטה הפתוחה ${used === 1 ? "שורה אחת מסומנת" : used + " שורות מסומנות"} "מחיר חדש"` : ""}`
    : "נשמר");
}

/* ---------- 2.0: build a quote in chat (text or voice) ---------- */
const PRICE_OF = name => { const c = S.catalog.find(x => x.p === name); return c ? catSale(c) : null; };
function parseBom(text){
  const t = text.replace(/[״"]/g, '"').replace(/×/g, "X").replace(/x/g, "X");
  const out = [];
  const re = /(\d+)?\s*(מא"ז|מאז|מפסק ראשי|מפסק|פחת|מגען|מגענים|נורות|נורה|ארון)\s*(\d+\s*X\s*\d+|\d+\/\d+\/\d+)?/g;
  let m;
  while ((m = re.exec(t))){
    const qty = m[1] ? +m[1] : 1, kind = m[2], spec = (m[3] || "").replace(/\s/g, "");
    const [pa, ia] = spec.includes("X") ? spec.split("X").map(Number) : [null, null];
    let name, chips = [];
    if (/מא/.test(kind) && pa){ name = pa === 1 && false ? "" : `מא"ז ABB S20${pa}M ${pa}P ‏${ia}A`; }
    else if (kind === "מפסק ראשי" || (kind === "מפסק" && pa)){ name = `מפסק ראשי ${pa}P ‏${ia}A`; chips.push(["סוג לפי הזרם", "warn"]); }
    else if (kind === "פחת" && pa){ name = `מפסק פחת ${pa}P ‏${ia}A ‏30mA`; chips.push(["30mA ברירת מחדל", "out"]); }
    else if (/מגען/.test(kind)){ name = pa ? `מגען ${pa}P ‏${ia}A` : "מגען (זרם לא נאמר)"; }
    else if (/נור/.test(kind)){ name = "נורת סימון 22 מ\"מ"; }
    else if (kind === "ארון"){ name = spec ? `ארון ${spec}` : "ארון (מידות לא נאמרו)"; }
    if (!name) continue;
    const price = PRICE_OF(name) ?? (name.startsWith("מפסק פחת 4P ‏40A") ? PRICE_OF("מפסק פחת 4P ‏40A ‏30mA") : null);
    out.push({name, qty, price, chips});
  }
  return out;
}
function buildSay(text, heard){
  const B = S.build;
  B.msgs.push({who:"u", text, heard});
  const found = parseBom(text);
  if (!found.length){
    B.msgs.push({who:"a", text:"לא זיהיתי רכיבים. נסו למשל: \"מפסק ראשי 4X63, 12 מא\"ז 1X16, פחת 4X40\"."});
  } else {
    for (const f of found){ const ex = B.lines.find(l => l.name === f.name); if (ex) ex.qty += f.qty; else B.lines.push(f); }
    const miss = found.filter(f => f.price == null).length;
    B.msgs.push({who:"a", text:`הוספתי ${found.length} שורות. ${miss ? `ל-${miss} מהן אין מחיר במחירון, אפשר להזין בטבלה.` : "לכולן יש מחיר מהמחירון."} מה עוד יש בלוח?`});
  }
  render(); const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
}

  B.rec = true; render();

}

        ${B.lines.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>מוצר</th><th>כמות</th><th>ליחידה</th><th>סה"כ</th></tr></thead><tbody>

            <td class="n">${l.price == null ? `<input class="price-in" style="width:80px" data-bprice="${i}" placeholder="מחיר" inputmode="numeric" aria-label="מחיר ל${esc(l.name)}">` : ils(l.price)}</td><td class="n">${l.price == null ? "—" : ils(l.price * l.qty)}</td></tr>`).join("")}

function render(){
  const r = route();
  const app = $("#app");
  const scroll = $("#lines-scroll") ? $("#lines-scroll").scrollTop : 0;
  const msgScroll = $("#msgs") ? $("#msgs").scrollTop : null;
  app.innerHTML = r === "login" ? vLogin() : r === "home" ? vHome() : r === "new" ? vNew() : r === "review" ? vReview()
    : r === "audit" ? vAudit() : r === "prices" ? vPrices() : r === "queue" ? vQueue() : r === "build" ? vBuild() : vPrefs();
  document.title = "קונבורו";
  if (r === "review"){
    const ls = $("#lines-scroll"); if (ls) ls.scrollTop = scroll;
    const ms = $("#msgs"); if (ms) ms.scrollTop = msgScroll == null ? ms.scrollHeight : msgScroll;
    setupViewer();
  }
  if (r === "new" && S.upload.phase === "pick") setupDrop();
  if (r === "build"){ const ms = $("#msgs"); if (ms) ms.scrollTop = ms.scrollHeight; }
}

/* viewer: pan and zoom */
function setupViewer(){
  const v = $("#viewer"), c = $("#canvas"); if (!v || !c) return;
  if (S.zoom == null || S.fitPending){
    const s = Math.min(v.clientWidth / 1400, v.clientHeight / (1400*H/W)) || .5;
    S.zoom = s * .96; S.pan = {x:(v.clientWidth - 1400*S.zoom)/2, y:(v.clientHeight - 1400*H/W*S.zoom)/2};
    S.fitPending = false;
    if (S.focusBox){ focusOn(S.focusBox); S.focusBox = null; }
  }
  apply();
  function apply(){ c.style.transform = `translate(${S.pan.x}px,${S.pan.y}px) scale(${S.zoom})`; }
  let drag = null;
  v.onpointerdown = e => { if (e.target.closest(".vtools,.pageinfo")) return; drag = {x:e.clientX, y:e.clientY, px:S.pan.x, py:S.pan.y}; v.classList.add("drag"); v.setPointerCapture(e.pointerId); };
  v.onpointermove = e => { if (!drag) return; S.pan.x = drag.px + e.clientX - drag.x; S.pan.y = drag.py + e.clientY - drag.y; apply(); };
  v.onpointerup = v.onpointercancel = () => { drag = null; v.classList.remove("drag"); };
  v.onwheel = e => { e.preventDefault(); const r = v.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top); apply(); };
  window.__zoom = (f) => { zoomAt(f, v.clientWidth/2, v.clientHeight/2); apply(); };
  function zoomAt(f, cx, cy){ const nz = Math.max(.15, Math.min(4, S.zoom * f)); S.pan.x = cx - (cx - S.pan.x) * nz / S.zoom; S.pan.y = cy - (cy - S.pan.y) * nz / S.zoom; S.zoom = nz; }
  function focusOn(b){
    const k = 1400 / W; const bw = (b[3]-b[1])*k, bh = (b[4]-b[2])*k;
    S.zoom = Math.max(.35, Math.min(1.6, Math.min(v.clientWidth/(bw*3), v.clientHeight/(bh*3))));
    S.pan.x = v.clientWidth/2 - (b[1]*k + bw/2) * S.zoom; S.pan.y = v.clientHeight/2 - (b[2]*k + bh/2) * S.zoom;
  }
}
function showOnDrawing(boxes){
  if (!boxes || !boxes.length) return;
  const b = boxes.find(x => x[0] === S.page) || boxes[0];
  S.page = b[0]; S.fitPending = true; S.focusBox = b;
  if (matchMedia("(max-width:820px)").matches) S.tab = "drawing";
}

function setupDrop(){
  const d = $("#drop"), inp = $("#file-in"); if (!d) return;
  const add = list => { for (const f of list){ const o = {name:f.name, size:Math.round(f.size/1048576*10)/10, pages:null}; o.err = validateFile(o); S.upload.files.push(o); } render(); };
  inp.onchange = () => add(inp.files);
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); add(e.dataTransfer.files); };
}

function selectLine(id, open){
  S.sel = id; if (open !== undefined) S.open = open ? id : null;
  S.showFinding = null;
  const l = lineById(id);
  if (l && l.boxes && l.boxes.length && !l.boxes.some(b => b[0] === S.page)){ S.page = l.boxes[0][0]; S.fitPending = true; }
  render();
  const el = document.querySelector(`[data-line="${id}"]`); if (el) el.scrollIntoView({block:"nearest"});
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  const rowEl = e.target.closest("[data-line]");
  if (!t && rowEl && !e.target.closest("[data-stop],input")){
    const id = rowEl.dataset.line; selectLine(id, S.open !== id); return;
  }
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a){
    case "pw": { const p = $("#password"); p.type = p.type === "password" ? "text" : "password"; t.textContent = p.type === "password" ? "הצג" : "הסתר"; break; }
    case "forgot": toast("בדמו לא נשלח מייל. במוצר נשלח קישור לאיפוס"); break;
    case "logout": S.authed = false; store.del("authed"); location.hash = "login"; render(); break;
    case "sample": { const s = SAMPLES[+t.dataset.i]; const o = {...s}; o.err = validateFile(o); S.upload.files.push(o); render(); break; }
    case "clearfiles": S.upload.files = []; render(); break;
    case "rmfile": S.upload.files.splice(+t.dataset.i, 1); render(); break;
    case "upmode": S.upload.mode = t.dataset.m; render(); break;
    case "start": runPipeline(); break;
    case "cancelrun": clearTimeout(pipeTimer); S.upload.phase = "pick"; S.upload.stage = 0; render(); toast(S.upload.mode === "rev" ? "הפענוח בוטל" : "הפענוח בוטל. המקום במכסה שוחרר"); break;
    case "toreview": S.upload = newUpload(); location.hash = "review"; toast("הפענוח הסתיים: 13 מוצרים, 5 בלי מחיר"); break;
    case "pricef": S.priceF = t.dataset.f; render(); break;
    case "ed-rmsup": t.closest("tr").remove(); break;
    case "filter": S.filter = t.dataset.f; render(); break;
    case "tab": S.tab = t.dataset.tab; if (S.tab === "drawing") S.fitPending = true; render(); break;
    case "chat": S.chatOpen = !S.chatOpen; render(); break;
    case "page": S.page = +t.dataset.p; S.fitPending = true; S.showFinding = null; render(); break;
    case "zin": window.__zoom && window.__zoom(1.25); break;
    case "zout": window.__zoom && window.__zoom(1/1.25); break;
    case "zfit": S.fitPending = true; render(); break;
    case "showdraw": { const l = lineById(id); S.sel = id; showOnDrawing(l.boxes); render(); break; }
    case "approve": { const l = lineById(id); const snap = snapshotLines(); l.approved = true; l.chips = [["הוסק · אושר","ok"]]; pushUndo("אישור הסקה", () => restoreLines(snap)); render(); toast("ההסקה אושרה", true); break; }
    case "del": { const snap = snapshotLines(); const l = lineById(id); l.deleted = true; S.lines.filter(x => x.parent === id).forEach(x => x.deleted = true); S.open = null; pushUndo("מחיקת שורה", () => restoreLines(snap)); render(); toast("השורה נמחקה", true); break; }
    case "alt": { const l = lineById(id); const snap = snapshotLines(); const prev = l.name; l.name = t.dataset.alt; if (l.inferred){ l.approved = true; l.chips = [["נבחר ידנית","ok"]]; } pushUndo("החלפת מוצר", () => restoreLines(snap)); render(); toast(`הוחלף: ${prev} ← ${l.name}`, true); break; }
    case "savelist": { const l = lineById(id); l.saveToList = l.saveToList === false; render(); break; }
    case "undo": doUndo(); break;
    case "send": {
      const t2 = totals();
      modal(`<h2>לשלוח את גרסה ${S.version}?</h2>
        <dl class="kv"><dt>לפני מע"מ</dt><dd class="num"><b>${ils(t2.sub)}</b></dd><dd></dd><dt>כולל מע"מ</dt><dd class="num">${ils(t2.total)}</dd><dd></dd></dl>
        ${t2.r ? `<div class="small" style="background:var(--bad-soft);color:var(--bad);padding:10px;border-radius:var(--r-sm)">${t2.r} שורות בלי מחיר יופיעו בהצעה בלי סכום. מומלץ להשלים לפני השליחה.</div>` : ""}
        ${t2.y ? `<div class="small" style="background:var(--warn-soft);color:var(--warn);padding:10px;border-radius:var(--r-sm)">${t2.y} שורות צהובות לא אושרו.</div>` : ""}
        <span class="small muted">הלקוח מקבל תיאור, כמות, מחיר וסכום. לא עלות, לא רווח ולא צבעים.</span>
        <div class="row"><button class="btn primary" data-act="dosend">${t2.r||t2.y ? "שלח בכל זאת" : "שלח"}</button><button class="btn" data-act="close">חזרה להצעה</button></div>`);
      break;
    }
    case "dosend": closeModal(); S.locked = true; render(); toast(`גרסה ${S.version} נשלחה ונעולה`); break;
    case "newver": S.version++; S.locked = false; render(); toast(`נפתחה גרסה ${S.version}. הגרסה הקודמת נשמרה`); break;
    case "close": closeModal(); break;
    case "ask": ask(t.dataset.q); break;
    case "apply": applyProp(t.dataset.m); break;
    case "dismiss": { const m = S.msgs.find(x => x.id == t.dataset.m); m.prop.state = "dismissed"; render(); break; }
    case "newchat": if (S.msgs.length > 1){ S.oldConvs.push(S.msgs); } S.msgs = [{who:"a", text:"שיחה חדשה. ההחלטות מהשיחה הקודמת כבר בהצעה, אז לא צריך לחזור עליהן."}]; render(); break;
    case "goline": S.filter = "all"; selectLine(id, true); break;
    case "onlyred": S.filter = "r"; render(); break;
    case "f-onlyred": S.filter = "r"; render(); break;
    case "f-goto": { const f = S.findings.find(x => x.id === t.dataset.f); selectLine(f.line, true); break; }
    case "f-show": { const f = S.findings.find(x => x.id === t.dataset.f); S.sel = null; S.showFinding = f.id; showOnDrawing([f.box]); render(); break; }
    case "f-ignore": { const f = S.findings.find(x => x.id === t.dataset.f); f.done = true; pushUndo("סגירת ממצא", () => { f.done = false; }); render(); toast("הממצא נסגר: שאריות בחזית", true); break; }
    case "f-addf": { const f = S.findings.find(x => x.id === t.dataset.f); f.done = true; const snap = snapshotLines();
      S.lines.splice(S.lines.findIndex(l => l.id === "fnv"), 0, {id:"f26", grp:"יציאות", name:"מא\"ז 3P (זרם לא ידוע)", qty:4, des:["F26–F29"], price:null, hint:"נוסף מהחזית. אין זרם, דגם או מחיר", raw:"F26–F29 (בחזית בלבד)", src:[["מקור","חזית הלוח","עמוד 4"]], chips:[["מהחזית","warn"]], boxes:[f.box]});
      pushUndo("הוספת F26–F29", () => { restoreLines(snap); f.done = false; }); render(); toast("נוספו 4 שורות מהחזית", true); break; }
    case "qok": case "qno": { const q = S.queue.find(x => x.id == id); q.state = a === "qok" ? "ok" : "no"; render(); toast(a === "qok" ? "עבר לשכבה המשותפת, עם מקור pilot_engineer" : "נדחה. נשאר רק אצלכם"); break; }
    case "cons": { const c = catById(t.dataset.id); c.consumable = !c.consumable; render(); toast(c.consumable ? "סומן כחומר עזר: לא שורה נפרדת בהצעה" : "בוטל סימון חומר עזר"); break; }
    case "margin": S.showMargin = !S.showMargin; render(); break;
    case "editprice": {
      const l = lineById(id), inp = $("#edit-" + id), v = parseFloat(inp.value);
      if (!(v > 0)){ inp.classList.add("err"); toast("הזינו מחיר ליחידה, במספרים"); break; }
      if (v === l.price){ toast("המחיר לא השתנה"); break; }
      S.pendingPrice = {id, v};
      const c = catById(l.cat);
      modal(`<h2>לעדכן גם במחירון?</h2>
        <span>שינית את המחיר של <b>${esc(l.name)}</b> מ-<b class="num">${ils(l.price)}</b> ל-<b class="num">${ils(v)}</b> בהצעה הזו.</span>
        <div class="small" style="background:var(--surface-2);padding:10px;border-radius:var(--r-sm);display:grid;gap:4px">
          <span><b>עדכון במחירון:</b> הצעות חדשות וחישוב מחדש ישתמשו במחיר החדש${c && c.mode === "markup" ? ", במקום חוק הרווח" : ""}.</span>
          <span><b>הצעות שנשלחו לא משתנות.</b> טיוטות פתוחות לא משתנות לבד, ויציגו שיש מחיר חדש.</span></div>
        <div class="row"><button class="btn primary" data-act="price-db">עדכן גם במחירון</button><button class="btn" data-act="price-here">רק בהצעה הזו</button><span class="spacer"></span><button class="btn ghost" data-act="close">ביטול</button></div>`);
      break;
    }
    case "price-db": case "price-here": {
      const {id: lid, v} = S.pendingPrice; const l = lineById(lid); const snap = snapshotLines(); const prev = l.price;
      const c = catById(l.cat); const catSnap = c ? JSON.stringify(c) : null;
      l.price = v;
      if (a === "price-db" && c){ c.mode = "fixed"; c.sale = v; c.src = "עודכן מהצעה NURSERY"; c.hist.unshift({d:"היום", t:`${ils(prev)} ← ${ils(v)}, מהצעה NURSERY`}); l.override = false; l.psrc = "מחירון, עודכן היום"; }
      else l.override = true;
      pushUndo("שינוי מחיר", () => { restoreLines(snap); if (c && catSnap) Object.assign(c, JSON.parse(catSnap)); });
      closeModal(); render();
      toast(a === "price-db" ? "עודכן במחירון. הצעות שנשלחו לא השתנו" : "המחיר שונה רק בהצעה הזו", true);
      break;
    }
    case "takefresh": { const l = lineById(id); const snap = snapshotLines(); l.price = catSale(catById(l.cat)); l.psrc = "מחירון, עודכן"; pushUndo("עדכון מחיר מהמחירון", () => restoreLines(snap)); render(); toast("המחיר עודכן מהמחירון", true); break; }
    case "addcost": {
      const l = lineById(id), v = parseFloat($("#cost-" + id).value), sname = ($("#costsup-" + id).value || "").trim() || "ספק לא צוין";
      if (!(v > 0)){ toast("הזינו עלות ליחידה, במספרים"); break; }
      const c = catById(l.cat);
      if (c){ c.sups.push({s:sname, cost:v, lead:null, pref:!c.sups.length, ssku:"", date:"היום"}); c.hist.unshift({d:"היום", t:`נוסף ספק: ${sname}, ${ils(v)}`}); }
      else { l.costOverride = v; l.costSupplier = sname; }
      render(); toast(`העלות נשמרה${c ? " במחירון" : " להצעה הזו"}`); break;
    }
    case "prod": openEditor(t.dataset.id); break;
    case "mkpref": { const l = lineById(id), c = catById(l.cat); c.sups.forEach(x => x.pref = x.s === l.supplier); c.hist.unshift({d:"היום", t:`ספק מועדף: ${l.supplier}`}); l.supplier = null; render(); toast("הספק המועדף עודכן במחירון. מחירי המכירה לא השתנו"); break; }
    case "prod-new": openEditor(null); break;
    case "ed-addsup": { const tb = $("#ed-sups"); const i = tb.children.length; tb.insertAdjacentHTML("beforeend", supRow({s:"", cost:"", lead:"", ssku:"", pref:false}, i)); break; }
    case "ed-save": saveEditor(); break;
    case "pref": S.prefs[t.dataset.k] = !S.prefs[t.dataset.k]; render(); break;
    case "toast": toast(t.dataset.t); break;
    case "flag": { const k = t.dataset.k; S.flags[k] = !S.flags[k]; if (k === "chat_builder" && !S.flags[k]) S.flags.voice = false; store.set("flags", JSON.stringify(S.flags)); render(); toast(`${FLAGS.find(f => f.k === k).name}: ${S.flags[k] ? "פעיל" : "כבוי"}`); break; }
    case "export": exportModal(); break;
    case "exp": closeModal(); toast(`במוצר: קובץ ${t.dataset.t} יורד. בדמו ההורדה חסומה`); break;
    case "ux": S.showUnresolved = !S.showUnresolved; render(); break;
    case "mic": startRec(); break;
    case "mic-home": if (!on("chat_builder")){ toast("בניית הצעה בצ'אט כבויה. אפשר להפעיל בהגדרות"); break; } S.build = {msgs:[], lines:[], rec:false}; location.hash = "build"; setTimeout(startRec, 50); break;
    case "home-sugg": homeSubmit(t.dataset.q); break;
  }
});

/* price entry: Enter saves and jumps to the next empty price */
document.addEventListener("keydown", e => {
  const bpin = e.target.closest && e.target.closest("[data-bprice]");
  if (bpin && e.key === "Enter"){ e.preventDefault(); const v = parseFloat(bpin.value); if (v > 0){ const l = S.build.lines[+bpin.dataset.bprice]; l.price = v; S.catalog.unshift({id:"b_"+Date.now(), p:l.name, sku:"", brand:"", fam:"", mode:"fixed", sale:v, src:"הוזן ידנית", sups:[], hist:[]}); render(); toast(`נשמר במחירון: ${l.name}, ${ils(v)}`); const n = document.querySelector("[data-bprice]"); if (n) n.focus(); } return; }
  if (e.key === "Enter" && e.target.matches && e.target.matches("tr.click")){ openEditor(e.target.dataset.id); return; }
  if (e.target.id === "home-input" && e.key === "Enter" && !e.shiftKey){ e.preventDefault(); homeSubmit(e.target.value); return; }
  const pin = e.target.closest && e.target.closest("[data-price]");
  if (pin && e.key === "Enter"){
    e.preventDefault();
    const v = parseFloat(pin.value.replace(/[^\d.]/g, ""));
    const l = lineById(pin.dataset.price);
    if (!(v > 0)){ pin.style.outline = "2px solid var(--bad)"; toast("הזינו מחיר ליחידה, במספרים"); return; }
    const snap = snapshotLines();
    l.price = v; l.psrc = "הוזן ידנית, היום";
    if (l.saveToList !== false){ const id = "new_" + l.id; S.catalog.unshift({id, p:l.name, sku:"", brand:"", fam:"", mode:"fixed", sale:v, src:"הוזן ידנית", sups:[], hist:[{d:"היום", t:`נוצר מהצעה NURSERY, ${ils(v)}`}]}); l.cat = id; }
    pushUndo("הזנת מחיר", () => restoreLines(snap));
    render();
    toast(l.saveToList !== false ? `נשמר במחירון: ${l.name}, ${ils(v)}` : `נשמר להצעה הזו בלבד`, true);
    const next = document.querySelector("[data-price]"); if (next) next.focus();
    return;
  }
  if (route() !== "review") return;
  if (e.target.matches("input,textarea,select")){ if (e.key === "Escape") e.target.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); doUndo(); return; }
  if (e.key === "/" || e.code === "Slash"){ e.preventDefault(); if (!S.chatOpen && !matchMedia("(max-width:820px)").matches){ S.chatOpen = true; render(); } if (matchMedia("(max-width:820px)").matches){ S.tab = "chat"; render(); } const ci = $("#chat-input"); if (ci) ci.focus(); return; }
  if (e.key === "Escape"){ if ($(".modal-bg")) closeModal(); else { S.open = null; render(); } return; }
  const vis = [...document.querySelectorAll("[data-line]")].map(x => x.dataset.line);
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    let i = vis.indexOf(S.sel); i = e.key === "ArrowDown" ? Math.min(vis.length-1, i+1) : Math.max(0, i-1);
    selectLine(vis[i]);
  } else if (e.key === "Enter" && S.sel){ selectLine(S.sel, S.open !== S.sel); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "login-form"){
    const em = $("#email"), pw = $("#password"), err = $("#login-err");
    em.classList.remove("err"); pw.classList.remove("err");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em.value)){ em.classList.add("err"); err.textContent = "כתובת האימייל לא תקינה"; em.focus(); return; }
    if (pw.value.length < 8){ pw.classList.add("err"); err.textContent = "הסיסמה צריכה להיות באורך 8 תווים לפחות"; pw.focus(); return; }
    S.authed = true; S.user = em.value; store.set("authed","1"); store.set("user", em.value);
    location.hash = "home"; render();
  } else if (e.target.id === "home-form"){
    homeSubmit($("#home-input").value);
  } else if (e.target.id === "build-form"){
    const i = $("#build-input"); const q = i.value; i.value = ""; if (q.trim()) buildSay(q);
  } else if (e.target.id === "chat-form"){
    const i = $("#chat-input"); const q = i.value; i.value = ""; ask(q);
  }
});
document.addEventListener("toggle", e => { if (e.target.id === "samples") S.upload.samplesOpen = e.target.open; }, true);
document.addEventListener("change", e => {
  const up = e.target.closest && e.target.closest("[data-upf]");
  if (up){ S.upload[up.dataset.upf] = up.value; if (up.tagName === "SELECT") render(); return; }
  const ss = e.target.closest && e.target.closest("[data-supsel]");
  if (ss){ const l = lineById(ss.dataset.supsel); l.supplier = ss.value; render(); toast(`הספק בהצעה הזו: ${ss.value}`); }
});
document.addEventListener("input", e => {
  if (e.target.dataset && e.target.dataset.upf && e.target.tagName === "INPUT"){ S.upload[e.target.dataset.upf] = e.target.value; return; }
  if (e.target.id === "price-q"){ S.priceQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#price-q"); n.focus(); n.setSelectionRange(pos,pos); }
  if (e.target.id === "markup"){ const v = parseInt(e.target.value, 10); if (v >= 0) S.prefs.markup = v; }
});
window.addEventListener("resize", () => { if (route() === "review"){ S.fitPending = true; setupViewer(); } });
render();
