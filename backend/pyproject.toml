[project]
name = "konboro"
version = "0.1.0"
description = "Konboro: quotes for electrical-panel factories, from drawings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.70",
    "boto3>=1.35",
    "fastapi>=0.115",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11",
    "pi-heif>=1.4.0",
    "pillow>=11",
    "playwright==1.64.1",  # the customer PDF (S26); the frontend's @playwright/test version, so one Chromium serves both
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pip-licenses>=5.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["konboro", "konboro_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]  # the repo root, for the eval harness (../eval)
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the docker-compose services (make up)",
]

# Measured only for the pricing code (`make test-unit`'s --cov), which needs 100% branch coverage (07 §10.1).
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Hebrew text and lookalike characters are intended
    "UP046",                       # keep explicit TypeVar generics in konboro_llm (bound=BaseModel reads clearer)
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; table names in test SQL come from our own metadata, not from input;
# tests use fixed fake passwords and keys
"tests/**" = ["S101", "S105", "S106", "S608"]
"alembic/versions/**" = ["E501"]  # autogenerated table definitions
# Pydantic copies field defaults per instance, so `= []` is safe; ruff only knows when BaseModel is the direct parent
"konboro/contracts/**" = ["RUF012"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ folder is not our package
known-first-party = ["eval"]  # ../eval, on the path through pytest's pythonpath

[tool.mypy]
python_version = "3.12"
mypy_path = ".."
packages = ["konboro", "konboro_llm", "eval"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Strict where correctness matters most (dev-strategy §4): the model gateway, stage contracts, pure domain logic.
module = ["konboro_llm.*", "konboro.contracts.*", "konboro.domain.*"]
strict = true

[[tool.mypy.overrides]]
# boto3, pypdfium2 and pi_heif ship without type stubs; they are wrapped in konboro.services (aws, storage, queue,
# intake) and konboro.pipeline.intake.pages
module = ["boto3", "botocore.*", "pypdfium2", "pi_heif"]
ignore_missing_imports = true
